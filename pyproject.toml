[project]
name = "codelexity"
version = "0.3.0"
description = "A package that measures code complexity in the age of AI slop."
readme = "README.md"
requires-python = ">=3.11"
maintainers = [{ name = "nickgiki" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Only DiGraph, katz_centrality and PowerIterationFailedConvergence are used, all stable since
    # networkx 3.0; from_nx/save_graph likewise for pyvis. Floors verified with --resolution
    # lowest-direct, no upper caps.
    "networkx>=3.0",
    "pyvis>=0.3.2",
]

keywords = ["complexity", "halstead", "maintainability", "cyclomatic", "static-analysis", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# Multi-language parsing (tree-sitter). Optional: the base install stays networkx+pyvis
# only, and grammar packages ship native wheels per-platform - users who only analyze
# Python shouldn't pay that install cost. Each grammar import is guarded, so codelexity
# always imports fine without this extra; unsupported languages just land in
# AnalysisResult.unsupported_files.
multi-lang = [
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.26",
    "tree-sitter-java>=0.23,<0.26",
    "tree-sitter-c-sharp>=0.23,<0.26",
]
# Streamlit trigger UI + Jinja2-templated HTML report. Optional: the CLI/library use
# case has zero UI dependencies today and shouldn't be forced to pull in Streamlit's
# dependency tree.
ui = [
    "streamlit>=1.38",
    "jinja2>=3.1",
]
# Headless CI usage (codelexity-ci) needs the Jinja2-templated HTML report but not
# Streamlit - kept as its own extra so `pip install codelexity[multi-lang,ci]` in a
# GitHub Actions runner doesn't pull in a browser UI dependency it will never use.
ci = [
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/nickgiki/codelexity"
Issues = "https://github.com/nickgiki/codelexity/issues"
Changelog = "https://github.com/nickgiki/codelexity/blob/main/CHANGELOG.md"

[project.scripts]
codelexity = "codelexity.main:main"
codelexity-ci = "codelexity.ci:main"

[tool.uv.sources]
codelexity = { path = "src", editable = true }

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bumpver>=2026.1132",
    "prek>=0.4.14",
    "ruff>=0.16.3",
]

[tool.bumpver]
current_version = "0.3.0"
version_pattern = "MAJOR.MINOR.PATCH"
push = false  # inspect the tag before it leaves the machine

[tool.bumpver.file_patterns]
# The version appears twice in this file: [project] version and current_version above.
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']
# No README pattern: its version badge reads live from PyPI, so there is no literal to rewrite.

[tool.ruff]
# Set your preferred line length rule
line-length = 120

[tool.ruff.lint]
# E, F = standard errors/warnings
# I = Isort (handles argument/import sorting rules)
select = ["E", "F", "I"]
ignore = ["E731"]


[tool.ruff.lint.isort]
# Forces arguments/imports into a specific sorted structure
force-single-line = false
order-by-type = true


